<h4>How to make rice</h4>
<ol>
    <li>Take a cup of rice</li>
    <li>Wash the rice</li>
    <li>Add water to the rice</li>
    <li>Boil the rice</li>
</ol>

<h4>Characteristics of Properly cooked rice</h4>
<ul>
    <li>Fluffy</li>
    <li>Soft</li>
    <li>Not sticky</li>
    <li>Not hard</li>
</ul>
