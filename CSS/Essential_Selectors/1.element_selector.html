<!-- 1. Element Selector: Targets ALL <p> elements on the page by their tag name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1. Element Selector</title>
  <style>
    /* Element Selector: just write the tag name */
    p {
      color: blue;
      background-color: #e6f2ff;
      padding: 10px;
      border-left: 4px solid blue;
    }
  </style>
</head>
<body>

  <h2>Element Selector (<code>p</code>)</h2>
  <p>This is the first paragraph. It gets styled automatically because its tag is &lt;p&gt;.</p>
  <p>This is a second paragraph. Every &lt;p&gt; tag on the page gets the exact same style!</p>
  <div>This is a &lt;div&gt;, so the <code>p</code> selector ignores it.</div>

</body>
</html>
