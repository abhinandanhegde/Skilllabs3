<!-- 2. Class Selector: Targets any element with class="card" (starts with a dot .) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2. Class Selector</title>
  <style>
    /* Class Selector: starts with a dot (.) and can be reused on multiple elements */
    .card {
      background-color: #ffe6e6;
      border: 2px solid red;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h2>Class Selector (<code>.card</code>)</h2>
  <div class="card">Card 1: This div uses <code>class="card"</code>.</div>
  <div class="card">Card 2: Classes are reusable! We can apply <code>class="card"</code> to many elements.</div>
  <p class="card">Card 3: Even a paragraph can use <code>class="card"</code>!</p>

</body>
</html>
