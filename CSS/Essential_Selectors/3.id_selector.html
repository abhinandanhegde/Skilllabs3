<!-- 3. ID Selector: Targets a single unique element with id="main" (starts with a hash #) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3. ID Selector</title>
  <style>
    /* ID Selector: starts with a hash (#). Used for a unique element on the page */
    #main {
      background-color: lightgreen;
      border: 2px solid darkgreen;
      padding: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ID Selector (<code>#main</code>)</h2>
  <div id="main">This div has <code>id="main"</code>. An ID must be unique (used only once per page)!</div>
  <p>This normal paragraph does not have the ID, so it is not styled.</p>

</body>
</html>
