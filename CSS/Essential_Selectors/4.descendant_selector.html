<!-- 4. Descendant Selector: Targets <p> anywhere inside .card (uses a space) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4. Descendant Selector</title>
  <style>
    .card {
      border: 2px solid #333;
      padding: 15px;
    }
    /* Descendant Selector (.card p): styles ANY <p> inside .card, no matter how deeply nested */
    .card p {
      color: darkblue;
      background-color: #dbeafe;
      padding: 8px;
    }
  </style>
</head>
<body>

  <h2>Descendant Selector (<code>.card p</code>)</h2>

  <div class="card">
    <p>Paragraph 1: I am directly inside <code>.card</code> (Styled!).</p>
    <div>
      <p>Paragraph 2: I am nested inside another div inside <code>.card</code> (Still Styled!).</p>
    </div>
  </div>

  <p>Paragraph 3: I am outside <code>.card</code> (Not styled).</p>

</body>
</html>
